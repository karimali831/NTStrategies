name: AI multi-contract basket research checks
on:
  pull_request:
    paths:
      - 'src/Strategies/NinjexAiHistoricalResearchExporter/**'
      - 'tools/ai_market_batch_audit.py'
      - 'tests/ai_market_batch_audit/**'
      - 'tests/AiHistoricalResearchExporterChecks/**'
      - '.github/workflows/ai-basket-research-checks.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/ai_market_batch_audit -v
