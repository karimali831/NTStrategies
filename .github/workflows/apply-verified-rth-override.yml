name: Apply verified RTH open override patch

on:
  push:
    branches:
      - feature/verified-rth-open-overrides
    paths:
      - scripts/patch_verified_rth_override.py
      - .github/workflows/apply-verified-rth-override.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/verified-rth-open-overrides
          fetch-depth: 0

      - name: Apply targeted strategy patch
        run: python3 scripts/patch_verified_rth_override.py

      - name: Remove one-shot patch files
        run: |
          rm scripts/patch_verified_rth_override.py
          rm .github/workflows/apply-verified-rth-override.yml

      - name: Commit patched strategy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add verified RTH open override support"
          git push origin HEAD:feature/verified-rth-open-overrides
