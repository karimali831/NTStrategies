name: Temporary patch Playback zero baseline

on:
  push:
    branches:
      - fix/playback-recovery-zero-baseline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[playback-zero-baseline-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playback-recovery-zero-baseline
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          live_path = Path('src/Strategies/NinjexOvernightEdgePortfolio/LiveDailyState.cs')
          live = live_path.read_text(encoding='utf-8-sig')

          old = '''            LiveDailyStateSnapshot rebuilt;\n            string rebuildError;\n            if (TryRebuildLiveDailyStateFromAccountExecutions(\n                    tradingDate,\n                    out rebuilt,\n                    out rebuildError)\n                && rebuilt.Trades > 0)\n            {\n                ApplyRecoveredLiveDailyState(\n                    rebuilt,\n                    eventTime,\n                    \"AccountExecutions\");\n\n                PersistLiveDailyState(\n                    eventTime,\n                    false,\n                    \"InitialRecoveryFromExecutions\");\n\n                return true;\n            }\n\n            // A strategy that has been running before the entry window can\n            // safely establish the day's zero baseline. Once the entry window\n            // has opened, an absent snapshot plus zero visible executions is\n            // ambiguous after a restart, so fail closed rather than assume zero.\n            if (ToTimeValue(eventTime) < EntryStartTime)\n            {\n                var zero = new LiveDailyStateSnapshot\n                {\n                    TradingDate = tradingDate,\n                    Trades = 0,\n                    Winners = 0,\n                    Losses = 0,\n                    GrossPnl = 0,\n                    OpenTrade = false\n                };\n\n                ApplyRecoveredLiveDailyState(\n                    zero,\n                    eventTime,\n                    \"NewDayZero\");\n\n                PersistLiveDailyState(\n                    eventTime,\n                    false,\n                    \"NewDayZero\");\n\n                return true;\n            }\n'''

          new = '''            LiveDailyStateSnapshot rebuilt;\n            string rebuildError;\n            var rebuiltAvailable =\n                TryRebuildLiveDailyStateFromAccountExecutions(\n                    tradingDate,\n                    out rebuilt,\n                    out rebuildError);\n\n            if (rebuiltAvailable\n                && rebuilt.Trades > 0)\n            {\n                ApplyRecoveredLiveDailyState(\n                    rebuilt,\n                    eventTime,\n                    \"AccountExecutions\");\n\n                PersistLiveDailyState(\n                    eventTime,\n                    false,\n                    \"InitialRecoveryFromExecutions\");\n\n                return true;\n            }\n\n            // In explicit Playback restart-simulation mode, the very first\n            // enable may intentionally begin after the normal 09:35 entry\n            // window. If the current Playback account/session was read\n            // successfully and contains zero strategy executions, that is a\n            // trustworthy fresh 0/0/0 baseline for the simulation. Genuine\n            // live accounts deliberately do NOT get this relaxation.\n            bool isPlaybackSimulation;\n            if (rebuiltAvailable\n                && rebuilt.Trades == 0\n                && EnablePlaybackRestartRecoverySimulation\n                && TryDetectPlaybackRecoveryContext(\n                    out isPlaybackSimulation)\n                && isPlaybackSimulation)\n            {\n                ApplyRecoveredLiveDailyState(\n                    rebuilt,\n                    eventTime,\n                    \"PlaybackSimulationZero\");\n\n                PersistLiveDailyState(\n                    eventTime,\n                    false,\n                    \"PlaybackSimulationZero\");\n\n                return true;\n            }\n\n            // A genuine live strategy that has been running before the entry\n            // window can safely establish the day's zero baseline. Once the\n            // entry window has opened, an absent snapshot plus zero visible\n            // executions remains ambiguous live and therefore fails closed.\n            if (ToTimeValue(eventTime) < EntryStartTime)\n            {\n                var zero = new LiveDailyStateSnapshot\n                {\n                    TradingDate = tradingDate,\n                    Trades = 0,\n                    Winners = 0,\n                    Losses = 0,\n                    GrossPnl = 0,\n                    OpenTrade = false\n                };\n\n                ApplyRecoveredLiveDailyState(\n                    zero,\n                    eventTime,\n                    \"NewDayZero\");\n\n                PersistLiveDailyState(\n                    eventTime,\n                    false,\n                    \"NewDayZero\");\n\n                return true;\n            }\n'''

          assert old in live, 'target recovery block not found'
          live = live.replace(old, new, 1)
          live_path.write_text(live, encoding='utf-8')

          core_path = Path('src/Strategies/NinjexOvernightEdgePortfolio/Core.cs')
          core = core_path.read_text(encoding='utf-8-sig')
          core = core.replace(
              'private const string StrategyVersion = "1.2.6-playback-restart-simulation";',
              'private const string StrategyVersion = "1.2.7-playback-zero-baseline";',
              1)
          core_path.write_text(core, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Strategies/NinjexOvernightEdgePortfolio/Core.cs src/Strategies/NinjexOvernightEdgePortfolio/LiveDailyState.cs
          git commit -m "[playback-zero-baseline-patched] Allow fresh Playback simulation zero baseline"
          git push origin HEAD:fix/playback-recovery-zero-baseline
