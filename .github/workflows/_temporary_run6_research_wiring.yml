name: Temporary Run6 research wiring
on:
  push:
    branches: [feat/overnight-edge-run6-research]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[run6-research-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/overnight-edge-run6-research
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path=Path('src/Strategies/NinjexOvernightEdgePortfolio/Core.cs')
          core=core_path.read_text(encoding='utf-8-sig')
          anchor='''                EnableDiagnostics = true;\n                EnableResearchTelemetry = false;\n'''
          assert anchor in core
          core=core.replace(anchor,anchor+'                EnableResearchPerturbationScenarios = false;\n',1)
          core_path.write_text(core,encoding='utf-8')

          rt_path=Path('src/Strategies/NinjexOvernightEdgePortfolio/ResearchTelemetry.cs')
          rt=rt_path.read_text(encoding='utf-8-sig')

          # Per-signal portfolio eligibility so selective PDC/PMH third trades are represented correctly.
          rt=rt.replace('''            var blockReason = GetResearchPortfolioBlockReason(false);\n            var portfolioEligible = string.IsNullOrEmpty(blockReason);\n\n''','',1)
          rt=rt.replace('''                    portfolioEligible, blockReason, qualifiedCount, priorRangeOk, null, priorWidthOk, null, null,''','''                    IsResearchSignalPortfolioEligible(PriorCloseEntrySignal), GetResearchPortfolioBlockReasonForSignal(PriorCloseEntrySignal, false), qualifiedCount, priorRangeOk, null, priorWidthOk, null, null,''',1)
          rt=rt.replace('''                    portfolioEligible, blockReason, qualifiedCount, null, pmhTimeOk, null, null, pmhAtrOk,''','''                    IsResearchSignalPortfolioEligible(PremarketHighEntrySignal), GetResearchPortfolioBlockReasonForSignal(PremarketHighEntrySignal, false), qualifiedCount, null, pmhTimeOk, null, null, pmhAtrOk,''',1)
          rt=rt.replace('''                    portfolioEligible, blockReason, qualifiedCount, null, rthTimeOk, null, rthWidthOk, null,''','''                    IsResearchSignalPortfolioEligible(RthOpenEntrySignal), GetResearchPortfolioBlockReasonForSignal(RthOpenEntrySignal, false), qualifiedCount, null, rthTimeOk, null, rthWidthOk, null,''',1)
          rt=rt.replace('''                    portfolioEligible, blockReason, qualifiedCount, null, null, null, null, pmlAtrOk,''','''                    IsResearchSignalPortfolioEligible(PremarketLowEntrySignal), GetResearchPortfolioBlockReasonForSignal(PremarketLowEntrySignal, false), qualifiedCount, null, null, null, null, pmlAtrOk,''',1)

          old='''        private string GetResearchPortfolioBlockReason(bool allowExistingPendingEntry)\n        {\n            if (Position.MarketPosition != MarketPosition.Flat || entryOrderPending || manualExitPending\n                || (!allowExistingPendingEntry && pendingDirection != PendingDirection.None))\n                return "OrderOrPositionActive";\n            if (MaxTradesPerDay > 0 && tradesToday >= MaxTradesPerDay)\n                return "MaxTrades";\n            if (MaxWinnersPerDay > 0 && winnersToday >= MaxWinnersPerDay)\n                return "MaxWinners";\n            if (MaxLossesPerDay > 0 && lossesToday >= MaxLossesPerDay)\n                return "MaxLosses";\n            return string.Empty;\n        }\n'''
          assert old in rt
          new='''        private string GetResearchPortfolioBlockReason(bool allowExistingPendingEntry)\n        {\n            return GetResearchPortfolioBlockReasonForSignal(string.Empty, allowExistingPendingEntry);\n        }\n\n        private bool IsResearchSignalPortfolioEligible(string signalName)\n        {\n            return string.IsNullOrEmpty(\n                GetResearchPortfolioBlockReasonForSignal(signalName, false));\n        }\n\n        private string GetResearchPortfolioBlockReasonForSignal(\n            string signalName,\n            bool allowExistingPendingEntry)\n        {\n            if (Position.MarketPosition != MarketPosition.Flat || entryOrderPending || manualExitPending\n                || (!allowExistingPendingEntry && pendingDirection != PendingDirection.None))\n                return "OrderOrPositionActive";\n            if (MaxTradesPerDay > 0 && tradesToday >= MaxTradesPerDay)\n                return "MaxTrades";\n            if (MaxWinnersPerDay > 0 && winnersToday >= MaxWinnersPerDay)\n                return "MaxWinners";\n            if (MaxLossesPerDay > 0 && lossesToday >= MaxLossesPerDay)\n            {\n                if (IsSelectiveThirdTradeAfterTwoLossesWindow()\n                    && (string.Equals(signalName, PriorCloseEntrySignal, StringComparison.Ordinal)\n                        || string.Equals(signalName, PremarketHighEntrySignal, StringComparison.Ordinal)))\n                    return string.Empty;\n                return "MaxLosses";\n            }\n            return string.Empty;\n        }\n'''
          rt=rt.replace(old,new,1)

          # Register/complete actual-trade perturbation batches.
          entry='''            activeResearchSignal.EntryPrice = entryPrice;\n            WriteResearchRow(activeResearchSignal);\n'''
          assert entry in rt
          rt=rt.replace(entry,entry+'''            RegisterResearchPerturbationTrade(\n                activeResearchSignal,\n                time,\n                entryPrice,\n                activeMaxHoldExitTime);\n''',1)

          exit='''            WriteResearchRow(row);\n            activeResearchSignal = null;\n            pendingResearchSignal = null;\n'''
          assert exit in rt
          rt=rt.replace(exit,'''            WriteResearchRow(row);\n            CompleteResearchPerturbationActualTrade(\n                time,\n                exitPrice,\n                exitName ?? string.Empty);\n            activeResearchSignal = null;\n            pendingResearchSignal = null;\n''',1)

          reset='''            pendingResearchSignal = null;\n            activeResearchSignal = null;\n        }\n'''
          assert reset in rt
          rt=rt.replace(reset,'''            pendingResearchSignal = null;\n            activeResearchSignal = null;\n            ResetResearchPerturbationDailyState();\n        }\n''',1)

          prop='''        public bool EnableResearchTelemetry\n        {\n            get;\n            set;\n        }\n'''
          assert prop in rt
          rt=rt.replace(prop,prop+'''\n        [NinjaScriptProperty]\n        [System.ComponentModel.DataAnnotations.Display(\n            Name = "Enable Research Perturbation Scenarios",\n            Description = "Research-only tick-level scenarios for entry fill sensitivity, target distance and break-even policies. Requires Research Telemetry. Never submits or changes real orders.",\n            GroupName = "8. Diagnostics",\n            Order = 3)]\n        public bool EnableResearchPerturbationScenarios\n        {\n            get;\n            set;\n        }\n''',1)
          rt_path.write_text(rt,encoding='utf-8')

          rs_path=Path('src/Strategies/NinjexOvernightEdgePortfolio/ResearchShadow.cs')
          rs=rs_path.read_text(encoding='utf-8-sig')
          hook='''            RegisterNewResearchShadowCandidates();\n\n            if (activeResearchShadows.Count == 0)\n                return;\n'''
          assert hook in rs
          rs=rs.replace(hook,'''            RegisterNewResearchShadowCandidates();\n            ProcessResearchPerturbationTick(time, price);\n\n            if (activeResearchShadows.Count == 0)\n                return;\n''',1)
          rs_path.write_text(rs,encoding='utf-8')

          proj_path=Path('NTStrategies.csproj')
          proj=proj_path.read_text(encoding='utf-8-sig')
          pa='        <Compile Include="src\\Strategies\\NinjexOvernightEdgePortfolio\\ResearchShadow.cs" />\n'
          assert pa in proj
          proj=proj.replace(pa,pa+'        <Compile Include="src\\Strategies\\NinjexOvernightEdgePortfolio\\ResearchPerturbation.cs" />\n',1)
          proj_path.write_text(proj,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NTStrategies.csproj src/Strategies/NinjexOvernightEdgePortfolio/Core.cs src/Strategies/NinjexOvernightEdgePortfolio/ResearchTelemetry.cs src/Strategies/NinjexOvernightEdgePortfolio/ResearchShadow.cs
          git commit -m "[run6-research-wired] Wire tick-level perturbation research"
          git push origin HEAD:feat/overnight-edge-run6-research
