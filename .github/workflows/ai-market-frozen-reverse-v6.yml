name: Ninjex AI frozen reversal check v6
on:
  pull_request:
    paths:
      - 'tools/ai_market_frozen_reverse_v6.py'
      - 'tests/ai_market_frozen_reverse/**'
      - '.github/workflows/ai-market-frozen-reverse-v6.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ai-market-ml.txt
      - run: python -m unittest discover -s tests/ai_market_frozen_reverse -v
      - run: python tools/ai_market_frozen_reverse_v6.py --help
      - run: python -m tools.ai_market_frozen_reverse_v6 --help
