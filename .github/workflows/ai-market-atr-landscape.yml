name: Ninjex AI ATR bracket landscape checks
on:
  pull_request:
    paths:
      - 'tools/ai_market_atr_bracket_landscape.py'
      - 'tests/ai_market_atr_landscape/**'
      - '.github/workflows/ai-market-atr-landscape.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ai-market-ml.txt
      - run: python -m unittest discover -s tests/ai_market_atr_landscape -v
      - run: python tools/ai_market_atr_bracket_landscape.py --help
      - run: python -m tools.ai_market_atr_bracket_landscape --help
