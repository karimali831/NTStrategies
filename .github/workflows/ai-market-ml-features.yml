name: AI session ML feature dataset checks
on:
  pull_request:
    paths:
      - 'tools/ai_market_ml_features.py'
      - 'tests/ai_market_ml_features/**'
      - '.github/workflows/ai-market-ml-features.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/ai_market_ml_features -v
