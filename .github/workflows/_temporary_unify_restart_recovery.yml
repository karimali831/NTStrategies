name: Temporary unify restart recovery

on:
  push:
    branches:
      - feat/unified-restart-recovery

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[unified-restart-recovery-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-restart-recovery
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('src/Strategies/NinjexOvernightEdgePortfolio/Core.cs')
          core = core_path.read_text(encoding='utf-8-sig')

          core = core.replace(
              'private const string StrategyVersion = "1.2.7-playback-zero-baseline";',
              'private const string StrategyVersion = "1.2.8-restart-recovery";',
              1)

          core = core.replace(
              '''                // Test-only. Leave false for normal / official Market Replay.\n                // When explicitly enabled, Playback exercises the same durable\n                // daily-state restart recovery used by genuine live accounts.\n                EnablePlaybackRestartRecoverySimulation = false;''',
              '''                // Safety function. Persist and restore the authoritative\n                // daily trade counters across strategy/NT/VPS restarts. Applies\n                // to genuine live trading and Playback live-restart simulation.\n                EnableRestartRecovery = true;''',
              1)

          core = core.replace(
              '"PlaybackRestartRecoverySimulation={13}",',
              '"RestartRecovery={13}",',
              1)
          core = core.replace(
              'researchTelemetryPath,\n                    EnablePlaybackRestartRecoverySimulation);',
              'researchTelemetryPath,\n                    EnableRestartRecovery);',
              1)

          core = core.replace(
              '''        [NinjaScriptProperty]\n        [Display(\n            Name = "Enable Playback Restart Recovery Simulation",\n            Description = "Test-only. When enabled, Playback persists/restores daily trade counters across strategy disable/re-enable using the same recovery path as live. Leave false for normal and official Market Replay runs.",\n            GroupName = "8. Diagnostics",\n            Order = 2)]\n        public bool EnablePlaybackRestartRecoverySimulation\n        {\n            get;\n            set;\n        }''',
              '''        [NinjaScriptProperty]\n        [Display(\n            Name = "Enable Restart Recovery",\n            Description = "Safety function. Persists and restores the authoritative daily trade counters across strategy, NinjaTrader, or VPS restarts. Applies to live trading and Playback restart simulation.",\n            GroupName = "7. Risk",\n            Order = 7)]\n        public bool EnableRestartRecovery\n        {\n            get;\n            set;\n        }''',
              1)

          core = core.replace(
              '''            // Restart-safe daily risk state. Historical always returns immediately.\n            // Playback also returns immediately unless the explicit restart-\n            // simulation diagnostic switch is enabled. Genuine live accounts\n            // always use recovery before a pending signal can become an order.''',
              '''            // Restart-safe daily risk state. Historical always returns immediately.\n            // When enabled, genuine live and Playback State.Realtime both use\n            // the same durable recovery path before a new entry can be submitted.''',
              1)

          core = core.replace(
              '''            // Daily caps are a live safety boundary. After NT/VPS/strategy\n            // restart, never evaluate them against historical reconstruction.\n            // Historical is always excluded. Playback participates only when\n            // the explicit restart-recovery simulation switch is enabled.''',
              '''            // Daily caps are a restart-safe boundary. After NT/VPS/strategy\n            // restart, never evaluate them against historical reconstruction.\n            // Historical is always excluded; live and Playback State.Realtime\n            // use recovery whenever EnableRestartRecovery is enabled.''',
              1)

          core_path.write_text(core, encoding='utf-8')

          live_path = Path('src/Strategies/NinjexOvernightEdgePortfolio/LiveDailyState.cs')
          live = live_path.read_text(encoding='utf-8-sig')

          live = live.replace('EnablePlaybackRestartRecoverySimulation', 'EnableRestartRecovery')

          live = live.replace(
              '''        /// Ensures the daily portfolio counters are authoritative before\n        /// entries can be evaluated. Historical processing is always ignored.\n        /// Playback is ignored by default so official Market Replay remains\n        /// identical to Run 4 / Run 5; it participates only when the explicit\n        /// restart-recovery simulation switch is enabled.''',
              '''        /// Ensures the daily portfolio counters are authoritative before\n        /// entries can be evaluated. Historical processing is always ignored.\n        /// When restart recovery is enabled, both genuine live trading and\n        /// Playback State.Realtime use the same durable recovery path.''',
              1)

          start = live.index('        private bool ShouldUseLiveDailyStateRecovery()')
          end = live.index('        private bool TryDetectPlaybackRecoveryContext(', start)
          replacement = '''        private bool ShouldUseLiveDailyStateRecovery()\n        {\n            return\n                EnableRestartRecovery\n                && State == State.Realtime\n                && Account != null;\n        }\n\n'''
          live = live[:start] + replacement + live[end:]

          live_path.write_text(live, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Strategies/NinjexOvernightEdgePortfolio/Core.cs src/Strategies/NinjexOvernightEdgePortfolio/LiveDailyState.cs
          git commit -m "[unified-restart-recovery-patched] Make restart recovery unified and enabled by default"
          git push origin HEAD:feat/unified-restart-recovery
