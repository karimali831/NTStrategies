name: AI direct trade expectancy research checks
on:
  pull_request:
    paths:
      - 'tools/ai_market_direct_expectancy.py'
      - 'tests/ai_market_direct_expectancy/**'
      - '.github/workflows/ai-market-direct-expectancy.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ai-market-ml.txt
      - run: python -m unittest discover -s tests/ai_market_direct_expectancy -v
      - run: python tools/ai_market_direct_expectancy.py --help
      - run: python -m tools.ai_market_direct_expectancy --help
