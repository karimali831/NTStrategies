name: Collector data quality
on:
  pull_request:
    paths:
      - 'src/Strategies/NinjexEsMarketResearchCollector/Core.cs'
      - 'tests/collector_data_quality.py'
      - '.github/workflows/collector-data-quality.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 tests/collector_data_quality.py
