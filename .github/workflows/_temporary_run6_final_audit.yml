name: Temporary Run6 final audit
on:
  push:
    branches: [feat/overnight-edge-run6-research]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[run6-final-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/overnight-edge-run6-research
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path=Path('src/Strategies/NinjexOvernightEdgePortfolio/Core.cs')
          core=core_path.read_text(encoding='utf-8-sig')
          old='''                    "MirrorVerifiedLiveExecutions={10} " +\n                    "ResearchTelemetry={11} ResearchPath='{12}' " +\n                    "RestartRecovery={13}",\n'''
          new='''                    "MirrorVerifiedLiveExecutions={10} " +\n                    "ResearchTelemetry={11} ResearchPath='{12}' " +\n                    "RestartRecovery={13} " +\n                    "PmhSlowEmaFilter={14} PmhMaxSlowEmaDist={15:0.0}t " +\n                    "SelectiveThirdPdcPmhAfterTwoLosses={16} " +\n                    "PerturbationScenarios={17}",\n'''
          assert old in core
          core=core.replace(old,new,1)
          oldargs='''                    EnableResearchTelemetry,\n                    researchTelemetryPath,\n                    EnableRestartRecovery);\n'''
          newargs='''                    EnableResearchTelemetry,\n                    researchTelemetryPath,\n                    EnableRestartRecovery,\n                    EnablePmhSlowEmaDistanceFilter,\n                    PmhMaximumSlowEmaDistanceTicks,\n                    EnableSelectivePdcPmhThirdTradeAfterTwoLosses,\n                    EnableResearchPerturbationScenarios);\n'''
          assert oldargs in core
          core=core.replace(oldargs,newargs,1)
          core=core.replace(
              '''                // Disabled by default. Verified overrides are intended only\n                // for forensic Replay/Historical reconstruction when a live\n                // RTH open discrepancy has been independently confirmed.\n                MirrorVerifiedLiveExecutions = false;''',
              '''                // Disabled by default. Forensic Replay/Historical mirror\n                // for independently verified live discrepancies only.\n                MirrorVerifiedLiveExecutions = false;''',
              1)
          core_path.write_text(core,encoding='utf-8')

          rs_path=Path('src/Strategies/NinjexOvernightEdgePortfolio/ResearchShadow.cs')
          rs=rs_path.read_text(encoding='utf-8-sig')
          old='''            if (!EnableResearchTelemetry\n                || researchTelemetryFaulted\n                || researchShadowOutputFaulted)\n            {\n                return;\n            }\n\n            var time = marketDataUpdate.Time;\n            var price = marketDataUpdate.Price;\n\n            if (!IsFinite(price))\n                return;\n\n            RegisterNewResearchShadowCandidates();\n            ProcessResearchPerturbationTick(time, price);\n\n            if (activeResearchShadows.Count == 0)\n                return;\n'''
          new='''            if (!EnableResearchTelemetry\n                || researchTelemetryFaulted)\n            {\n                return;\n            }\n\n            var time = marketDataUpdate.Time;\n            var price = marketDataUpdate.Price;\n\n            if (!IsFinite(price))\n                return;\n\n            // Perturbation research is intentionally independent of the\n            // shadow CSV sink. A shadow-output fault must not stop it.\n            ProcessResearchPerturbationTick(time, price);\n\n            if (researchShadowOutputFaulted)\n                return;\n\n            RegisterNewResearchShadowCandidates();\n\n            if (activeResearchShadows.Count == 0)\n                return;\n'''
          assert old in rs
          rs=rs.replace(old,new,1)
          rs_path.write_text(rs,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Strategies/NinjexOvernightEdgePortfolio/Core.cs src/Strategies/NinjexOvernightEdgePortfolio/ResearchShadow.cs
          git commit -m "[run6-final-audit] Improve Run6 diagnostics and decouple perturbation sink"
          git push origin HEAD:feat/overnight-edge-run6-research
