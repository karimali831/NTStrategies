name: AI validation opportunity diagnostics tests
on:
  pull_request:
    paths:
      - 'tools/ai_market_validation_opportunities.py'
      - 'tools/ai_market_train_baseline.py'
      - 'tests/ai_market_validation_opportunities/**'
      - '.github/workflows/ai-market-validation-opportunities.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ai-market-ml.txt
      - run: python -m unittest discover -s tests/ai_market_validation_opportunities -v
      - run: python tools/ai_market_validation_opportunities.py --help
      - run: python -m tools.ai_market_validation_opportunities --help
