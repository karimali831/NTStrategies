name: AI conservative ES bracket research tests
on:
  pull_request:
    paths:
      - 'tools/ai_market_bracket_research.py'
      - 'tests/ai_market_bracket_research/**'
      - '.github/workflows/ai-market-bracket-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ai-market-ml.txt
      - run: python -m unittest discover -s tests/ai_market_bracket_research -v
      - run: python tools/ai_market_bracket_research.py --help
      - run: python -m tools.ai_market_bracket_research --help
