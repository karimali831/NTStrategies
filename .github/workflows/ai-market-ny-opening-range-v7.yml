name: AI NY RTH opening range research tests
on:
  pull_request:
    paths:
      - 'tools/ai_market_ny_opening_range_v7.py'
      - 'tests/ai_market_ny_opening_range_v7/**'
      - '.github/workflows/ai-market-ny-opening-range-v7.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ai-market-ml.txt
      - run: python -m unittest discover -s tests/ai_market_ny_opening_range_v7 -v
      - run: python tools/ai_market_ny_opening_range_v7.py --help
      - run: python -m tools.ai_market_ny_opening_range_v7 --help
